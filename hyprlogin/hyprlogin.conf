# hyprlogin — https://github.com/AuthenticSm1les/hyprlogin
# Committed / store-backed (sourced by /etc/hyprlogin/hyprlogin.conf):
# changes need a nixos-rebuild switch.
# Palette matches waybar/.config/waybar/colors.css and hyprlock.conf.
#
# Shortcuts:
# - Enter: submit username / password
# - Tab / Shift+Tab / Left / Right: cycle sessions
# - Esc (on empty password field): return to username entry
# - Esc / Ctrl+U / Ctrl+Backspace: clear current field

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    immediate_render = true
    fail_timeout = 4000
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    color = rgb(0, 0, 0)
    # Note: hyprlogin runs as the `greeter` user, which cannot read inside
    # /home/<user> (mode 700). Put any future wallpaper in a world-readable
    # location (e.g. /usr/share/backgrounds/ or a Nix store path):
    # path = /path/to/wallpaper.png
    # blur_passes = 3
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgb(255, 255, 255)
    font_size = 72
    font_family = $font

    position = 0, 140
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgb(154, 174, 200)
    font_size = 16
    font_family = $font

    position = 0, 65
    halign = center
    valign = center
}

# Target user indicator (hidden while prompting for username)
label {
    monitor =
    text = Login as $GREETD_USER
    color = rgb(154, 174, 200)
    font_size = 14
    font_family = $font
    hide_when_empty = true

    position = 0, 22
    halign = center
    valign = center
}

# Username / password input
input-field {
    monitor =
    size = 320, 46
    outline_thickness = 2
    rounding = 6

    inner_color = rgb(18, 24, 36)
    outer_color = rgb(26, 111, 212)
    check_color = rgb(74, 158, 255)
    fail_color = rgb(255, 85, 85)
    capslock_color = rgb(240, 160, 48)
    font_color = rgb(255, 255, 255)

    fade_on_empty = false
    font_family = $font
    placeholder_text = <span foreground="##9aaec8">Password...</span>
    placeholder_text_username = <span foreground="##9aaec8">Username...</span>
    fail_text = $FAIL
    dots_spacing = 0.3

    position = 0, -25
    halign = center
    valign = center
}

# Selected session (click or Tab to cycle)
label {
    monitor =
    text = $GREETD_SESSION
    color = rgb(154, 174, 200)
    font_size = 14
    font_family = $font
    onclick = hyprlogin:session_next

    position = 30, 30
    halign = left
    valign = bottom
}
