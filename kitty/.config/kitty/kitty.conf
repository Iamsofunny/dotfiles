# Matches the Waybar / Fuzzel / SwayNC palette (waybar/.config/waybar/colors.css).
# Hot-reload running kitty windows with Ctrl+Shift+F5.

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window
# window_padding_width 8 0 8 0
background_opacity 0.85
background_blur    1

# Core colors
background            #0f1117
foreground            #dce6f5
selection_background  #1a6fd4
selection_foreground  #ffffff
cursor                #4a9eff
cursor_text_color     #0f1117
url_color             #7eb8f7

# Borders & tabs
active_border_color     #4a9eff
inactive_border_color   #1a2030
active_tab_foreground   #ffffff
active_tab_background   #1a6fd4
inactive_tab_foreground #5a6a8a
inactive_tab_background #0f1117
tab_bar_background      #0f1117

# 16-color ANSI palette
# black (border / text-inactive)
color0  #1a2030
color8  #5a6a8a

# red (urgent)
color1  #ff5555
color9  #ff7777

# green
color2  #4ec994
color10 #6ee0ae

# yellow (warning)
color3  #f0a030
color11 #f5ba5c

# blue (text-active / text-hover)
color4  #4a9eff
color12 #7eb8f7

# magenta
color5  #a78bfa
color13 #c4b5fd

# cyan
color6  #38bdf8
color14 #7dd3fc

# white (text / white)
color7  #dce6f5
color15 #ffffff

# Bare name = PATH lookup — works on Fedora (/usr/bin/fish) and NixOS
# (nix store); an absolute path only exists on one of the two.
shell fish
