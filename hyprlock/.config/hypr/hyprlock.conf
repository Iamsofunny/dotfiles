# hyprlock — https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Hot-reload: out-of-store symlink to ~/.config/hypr/hyprlock.conf.
# Palette matches waybar/.config/waybar/colors.css.

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    color = rgb(0, 0, 0)
    # To use a wallpaper later, uncomment and set path (or "screenshot"):
    # path = /path/to/wallpaper.png
    # blur_passes = 3
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgb(255, 255, 255)
    font_size = 72
    font_family = $font

    position = 0, 140
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgb(154, 174, 200)
    font_size = 16
    font_family = $font

    position = 0, 65
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 320, 46
    outline_thickness = 2
    rounding = 6

    inner_color = rgb(18, 24, 36)
    outer_color = rgb(26, 111, 212)
    check_color = rgb(74, 158, 255)
    fail_color = rgb(255, 85, 85)
    capslock_color = rgb(240, 160, 48)
    font_color = rgb(255, 255, 255)

    fade_on_empty = false
    font_family = $font
    placeholder_text = <span foreground="##9aaec8">Password...</span>
    fail_text = $PAMFAIL$FPRINTFAIL
    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}
